apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/inference-gateway.json"
          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ai-inference
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ai-inference
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: ai-inference
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: ''
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: ai-inference
data:
  inference-gateway.json: |
    {
      "dashboard": {
        "title": "AI Inference Gateway",
        "panels": [
          {
            "title": "Request Rate",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "rate(inference_requests_total[1m])",
                "legendFormat": "{{model}} - {{backend}} - {{status}}"
              }
            ]
          },
          {
            "title": "P95 Latency",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(inference_request_duration_seconds_bucket[5m]))",
                "legendFormat": "P95 - {{backend}}"
              }
            ]
          },
          {
            "title": "P99 Latency",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "histogram_quantile(0.99, rate(inference_request_duration_seconds_bucket[5m]))",
                "legendFormat": "P99 - {{backend}}"
              }
            ]
          },
          {
            "title": "Queue Depth",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "inference_queue_depth",
                "legendFormat": "{{backend}}"
              }
            ]
          },
          {
            "title": "Backend Health",
            "type": "stat",
            "gridPos": {"h": 4, "w": 24, "x": 0, "y": 16},
            "targets": [
              {
                "expr": "inference_backend_healthy",
                "legendFormat": "{{backend}}"
              }
            ]
          },
          {
            "title": "Tokens/Second",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
            "targets": [
              {
                "expr": "histogram_quantile(0.5, rate(inference_tokens_per_second_bucket[5m]))",
                "legendFormat": "Median - {{backend}}"
              }
            ]
          },
          {
            "title": "Routing Decisions",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
            "targets": [
              {
                "expr": "rate(inference_routing_decisions_total[1m])",
                "legendFormat": "{{algorithm}} → {{selected_backend}}"
              }
            ]
          }
        ]
      }
    }
