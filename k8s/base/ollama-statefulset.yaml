apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: ai-inference
  labels:
    app: ollama
spec:
  serviceName: ollama
  replicas: 3
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "11434"
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: model-storage
              mountPath: /root/.ollama
  volumeClaimTemplates:
    - metadata:
        name: model-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-inference
  labels:
    app: ollama
spec:
  clusterIP: None
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-0
  namespace: ai-inference
spec:
  selector:
    statefulset.kubernetes.io/pod-name: ollama-0
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-1
  namespace: ai-inference
spec:
  selector:
    statefulset.kubernetes.io/pod-name: ollama-1
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-2
  namespace: ai-inference
spec:
  selector:
    statefulset.kubernetes.io/pod-name: ollama-2
  ports:
    - port: 11434
      targetPort: 11434
