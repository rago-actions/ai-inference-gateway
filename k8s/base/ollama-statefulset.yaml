apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-backend
  namespace: ai-inference
  labels:
    app: llm-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-backend
  template:
    metadata:
      labels:
        app: llm-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "11434"
    spec:
      containers:
        - name: llm-backend
          image: mock-llm-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-0
  namespace: ai-inference
spec:
  selector:
    app: llm-backend
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-1
  namespace: ai-inference
spec:
  selector:
    app: llm-backend
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-2
  namespace: ai-inference
spec:
  selector:
    app: llm-backend
  ports:
    - port: 11434
      targetPort: 11434
